name: traffic

on:
  schedule:
    - cron: "* * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      burst_min:
        description: "Minimum requests per burst"
        default: "500"
      burst_max:
        description: "Maximum requests per burst"
        default: "1000"

permissions:
  contents: read

concurrency:
  group: traffic-burst
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BURST_MIN: ${{ github.event.inputs.burst_min || '100' }}
      BURST_MAX: ${{ github.event.inputs.burst_max || '300' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run burst
        run: node generate.mjs
